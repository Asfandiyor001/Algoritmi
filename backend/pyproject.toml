[project]
name = "algoritmi-backend"
version = "0.1.0"
description = "Algoritmi backend: Telegram orqali kirish, sessiyalar"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
