<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Algoritmi — interaktiv informatika</title>
    <meta name="description" content="Kompyuter, internet va AI qanday ishlashini o'z ko'zing bilan ko'r. O'zbek tilidagi bepul interaktiv informatika darslari: 1-sinfdan universitetgacha." />
    <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f1c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Tanlangan tema sahifa chizilishidan oldin qo'llanadi (oq "chaqnash" bo'lmasligi uchun).
      try {
        var t = JSON.parse(localStorage.getItem('algoritmi:tema'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Algoritmi ishlashi uchun JavaScript yoqilgan bo'lishi kerak.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
